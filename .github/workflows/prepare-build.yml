name: WorkRadar v3.3 Android Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract WorkRadar source
        run: |
          rm -rf extracted
          mkdir extracted

          unzip -q WorkRadar_v3_3_release_candidate.zip -d extracted

          ROOT="$(find extracted -type f -name pubspec.yaml -print -quit | xargs -r dirname)"

          if [ -z "$ROOT" ]; then
            echo "ERROR: pubspec.yaml not found in release ZIP"
            find extracted -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "Flutter project root: $ROOT"

          cp -a "$ROOT"/. .

          rm -rf extracted

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: stable

      - name: Setup Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.9/bin" >> "$GITHUB_PATH"
          "$HOME/gradle-8.9/bin/gradle" --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --pub

      - name: Build App Bundle
        run: flutter build appbundle --release --pub

      - name: Upload Android builds
        uses: actions/upload-artifact@v4
        with:
          name: WorkRadar-v3.3-Android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
