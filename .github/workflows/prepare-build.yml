name: WorkRadar v3.3 Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Extract WorkRadar source
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q WorkRadar_v3_3_release_candidate.zip -d extracted
          
          ROOT="$(find extracted -type f -name pubspec.yaml -print -quit | xargs -r dirname)"
          if [ -z "$ROOT" ]; then
            echo "ERROR: pubspec.yaml not found in release ZIP"
            exit 1
          fi
          
          cp -a "$ROOT/." .
          rm -rf extracted

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --pub

      - name: Upload Android builds
        uses: actions/upload-artifact@v4
        with:
          name: WorkRadar-v3.3-Android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
