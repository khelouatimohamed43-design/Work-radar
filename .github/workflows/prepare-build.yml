
name: WorkRadar v3.3 Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract WorkRadar source
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q WorkRadar_v3_3_release_candidate.zip -d extracted

          root=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)

          if [ -n "$root" ]; then
            cp -a "$root"/. .
          else
            cp -a extracted/. .
          fi

          rm -rf extracted

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Regenerate Flutter platform files
        run: |
          flutter create --platforms=android --no-pub .

      - name: Install dependencies
        run: |
          flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release

      - name: Build App Bundle
        run: |
          flutter build appbundle --release

      - name: Upload Android builds
        uses: actions/upload-artifact@v4
        with:
          name: WorkRadar-v3.3-Android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
